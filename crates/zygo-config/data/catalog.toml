[[model]]
id = "claude-sonnet-5-5"

  [model.facts]
  # always: thinking cannot be disabled (Models API reports thinking.types.disabled.supported = false);
  # "between_tools" is its lowest setting and turns off only up-front thinking.
  reasoning = "always"
  effort_levels = ["low", "medium", "high", "xhigh", "max"]
  max_output_tokens = 128000
  context_window = 1000000
  sampling = false
  vision = true
  structured_output = "native"
  forced_tool_choice = false
  verified_on = 2026-11-18
  source = "https://platform.claude.com/docs/en/models/sonnet-5-5/overview"

  [[model.provider]]
  name = "anthropic"
  base_url = "https://api.anthropic.com"
  dialects = ["anthropic"]
  upstream_model = "claude-sonnet-5-5"
  key = "env:ANTHROPIC_API_KEY"
  enabled = true
  [model.provider.price_usd_per_mtok]
  input = 2.0
  output = 10.0
  cache_read = 0.10
  cache_write = 4.0   # 1-hour rate (spec §6.3 example)

[[model]]
id = "claude-haiku-5-5"

  [model.facts]
  reasoning = "switchable"
  reasoning_default_on = true
  effort_levels = ["low", "medium", "high", "xhigh", "max"]
  max_output_tokens = 128000
  context_window = 1000000
  sampling = false
  vision = true
  structured_output = "native"
  forced_tool_choice = true
  verified_on = 2026-11-18
  source = "https://platform.claude.com/docs/en/models/haiku-5-5/overview"

  [[model.provider]]
  name = "anthropic"
  base_url = "https://api.anthropic.com"
  dialects = ["anthropic"]
  upstream_model = "claude-haiku-5-5"
  key = "env:ANTHROPIC_API_KEY"
  enabled = true
  [model.provider.price_usd_per_mtok]
  # prices are for prompts up to 100,000 tokens; above that: 0.50 / 2.50 / 0.05 / 1.00
  input = 0.10
  output = 0.50
  cache_read = 0.01
  cache_write = 0.20   # 1-hour rate (spec §6.3 example)

[[model]]
id = "gpt-6.2-astra"

  [model.facts]
  reasoning = "always"           # the API rejects reasoning effort "none"
  effort_levels = ["low", "medium", "high", "xhigh", "max"]
  max_output_tokens = 128000
  context_window = 922000        # documented maximum input; total context is 1.05M (§10.2 measures prompt tokens)
  sampling = false               # unverified for this model; dropping sampling is the safe value
  vision = true
  structured_output = "native"
  forced_tool_choice = false     # unverified for this model; false is the safe value (§7.6 widening)
  verified_on = 2026-11-18
  source = "https://developers.openai.com/api/docs/models/gpt-6.2-astra"

  [[model.provider]]
  name = "openai"
  base_url = "https://api.openai.com"
  dialects = ["openai"]
  upstream_model = "gpt-6.2-astra"
  key = "env:OPENAI_API_KEY"
  enabled = true
  [model.provider.price_usd_per_mtok]
  input = 8.0
  output = 40.0
  cache_read = 0.40
  cache_write = 10.0   # 30-minute-retention rate

