[[pattern]]
id = "anthropic_api_key"
pattern = '''sk-ant-[a-z]+[0-9]{2}-[A-Za-z0-9_-]{32,}'''
action = "redact"
description = "Anthropic API key"

[[pattern]]
id = "openrouter_api_key"
pattern = '''sk-or-v1-[0-9a-f]{64}'''
action = "redact"
description = "OpenRouter API key"

[[pattern]]
id = "openai_api_key"
pattern = '''sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{16,}T3BlbkFJ[A-Za-z0-9_-]{16,}'''
action = "redact"
description = "OpenAI API key"

[[pattern]]
id = "google_api_key"
pattern = '''AIza[0-9A-Za-z_-]{35}'''
action = "redact"
description = "Google API key"

[[pattern]]
id = "aws_access_key_id"
pattern = '''(?:AKIA|ASIA)[A-Z0-9]{16}\b'''
action = "redact"
description = "AWS access key id"

[[pattern]]
id = "azure_storage_key"
pattern = '''AccountKey=[A-Za-z0-9+/]{86}=='''
action = "redact"
description = "Azure storage account key"

[[pattern]]
id = "gcp_service_account_key"
pattern = '''"private_key"\s*:\s*"-{5}BEGIN PRIVATE KEY-{5}[^"]*"'''
action = "redact"
description = "GCP service-account private key"

[[pattern]]
id = "github_token"
pattern = '''(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})'''
action = "redact"
description = "GitHub token"

[[pattern]]
id = "gitlab_token"
pattern = '''glpat-[A-Za-z0-9_-]{20,}'''
action = "redact"
description = "GitLab personal access token"

[[pattern]]
id = "slack_token"
pattern = '''(?:xox[abposre]-|xapp-)[A-Za-z0-9-]{10,}'''
action = "redact"
description = "Slack token (bot, user, app, refresh, config)"

[[pattern]]
id = "private_key_pem"
pattern = '''-{5}BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-{5}(?:[\s\S]*?-{5}END (?:[A-Z0-9]+ )*PRIVATE KEY-{5}|[\s\S]*)'''
action = "redact"
description = "PEM private key block, through its END line or, when truncated, the end of the string"

[[pattern]]
id = "pgp_private_key_block"
pattern = '''-{5}BEGIN PGP PRIVATE KEY BLOCK-{5}(?:[\s\S]*?-{5}END PGP PRIVATE KEY BLOCK-{5}|[\s\S]*)'''
action = "redact"
description = "PGP private key block, through its END line or, when truncated, the end of the string"

[[pattern]]
id = "jwt"
pattern = '''eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'''
action = "redact"
description = "JSON Web Token"

[[pattern]]
id = "zygo_token"
pattern = '''zyg_[st]_[0-9A-Za-z]{43}'''
action = "redact"
description = "zygo team or session token"

[[pattern]]
id = "generic_secret_assignment"
pattern = '''(?m)(?i:[A-Za-z0-9_.-]*(?:password|passwd|secret|token|api[_-]?key|secret[_-]?(?:access[_-]?)?key))\\?["']?\s*[:=]\s*\\?["'](?P<secret>[^"'\r\n]{12,}?)\\?["']|^[ \t]*(?:export[ \t]+)?(?i:[A-Za-z0-9_.-]*(?:password|passwd|secret|token|api[_-]?key|secret[_-]?(?:access[_-]?)?key))=(?P<secret2>[^\s"'#]{12,})[ \t\r]*$|^[ \t]*(?i:[A-Za-z0-9_.-]*(?:password|passwd|secret|token|api[_-]?key|secret[_-]?(?:access[_-]?)?key)):[ \t]+(?P<secret3>[^\s"'#]{12,})[ \t\r]*$'''
action = "redact"
description = "a value of 12+ characters assigned to a name that ends in password/passwd/secret/token/api-key/secret-key: quoted (also with backslash-escaped quotes), an env-file line or a YAML line; only the value is replaced"
