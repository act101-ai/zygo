[package]
name = "zygo-launch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zygo-core.workspace = true
zygo-config.workspace = true
zygo-proxy.workspace = true
zygo-plugins.workspace = true
zygo-work.workspace = true
zygo-usage.workspace = true
zygo-redact.workspace = true
zygo-hooks.workspace = true
zygo-workspace.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
which.workspace = true
rand.workspace = true
base64.workspace = true
semver.workspace = true
toml.workspace = true
libc.workspace = true
fs4.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true

[features]
# `zygo-workspace/test-hooks`: `tests/stub_member.rs` compiles `crates/zygo/tests/common`, whose workspace harness
# uses `zygo_workspace::mux::testing` (M2).
test-hooks = ["zygo-workspace/test-hooks"]

[dev-dependencies]
zygo-launch = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
jsonschema = { version = "=0.61.2", default-features = false }

[[bin]]
name = "stub-agent"
path = "tests/stub_agent/stub.rs"
test = false
doc = false

# FX-34: the real-hook stub is its own binary, so `stub-agent` does not link `zygo_hooks`.
[[bin]]
name = "stub-hook"
path = "tests/stub_hook/stub.rs"
test = false
doc = false
