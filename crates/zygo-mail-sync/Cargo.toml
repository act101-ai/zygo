[package]
name = "zygo-mail-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zygo-core.workspace = true
zygo-config.workspace = true
zygo-work.workspace = true
zygo-plugins.workspace = true
zygo-workspace.workspace = true
zygo-redact.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
fs4.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The test hooks of zygo-workspace (`up::testing::hook`) for the tests of this crate only: the outbox tests drive the
# `mail_delivery_after_lock` point of `Delivery::begin` (FX-28 review round 2 F3). Production builds do not get them.
zygo-workspace = { workspace = true, features = ["test-hooks"] }
