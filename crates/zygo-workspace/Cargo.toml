[package]
name = "zygo-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zygo-core.workspace = true
zygo-config.workspace = true
zygo-work.workspace = true
zygo-proxy.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
fs4.workspace = true
libc.workspace = true
time.workspace = true
ulid.workspace = true

[features]
# Test hooks (`mux::testing`, node W3; `snapshot::testing`, node W6). The self dev-dependency below enables it for
# this crate's own tests, and the `test-hooks` feature of `crates/zygo` enables it (`zygo-workspace/test-hooks`, node
# M1) for the tests of `crates/zygo`.
test-hooks = []

[dev-dependencies]
zygo-workspace = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
