[package]
name = "zygo-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zygo-core.workspace = true
zygo-config.workspace = true
zygo-work.workspace = true
zygo-proxy.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
fs4.workspace = true
libc.workspace = true
time.workspace = true

[features]
# Test hooks (`mux::testing`, node W3; `snapshot::testing`, node W6); only the self dev-dependency below enables it,
# for this crate's own tests. The `test-hooks` feature of `crates/zygo` does not enable it yet: node M1 adds
# `zygo-workspace/test-hooks` to it (W3 Spec).
test-hooks = []

[dev-dependencies]
zygo-workspace = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
