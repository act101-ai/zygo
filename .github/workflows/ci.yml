name: ci
# Docs-only and README-only changes run no CI. Branch pushes run CI through their pull request only.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!LICENSE'
      - '!README.md'
      # Read by the tests (cargo test), so they still run CI:
      - 'docs/passthrough.md'
      - 'docs/premises.md'
      - 'docs/specs/2026-11-18-zygo-design.md'
      - 'docs/conformance/**'
      - 'docs/conformance.md'
      - 'docs/conformance.json'
      - 'docs/live-checks.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!LICENSE'
      - '!README.md'
      # Read by the tests (cargo test), so they still run CI:
      - 'docs/passthrough.md'
      - 'docs/premises.md'
      - 'docs/specs/2026-11-18-zygo-design.md'
      - 'docs/conformance/**'
      - 'docs/conformance.md'
      - 'docs/conformance.json'
      - 'docs/live-checks.md'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install libdbus (keyring Secret Service)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Install script (sh)
        if: matrix.os != 'windows-latest'
        run: sh scripts/test-install.sh
      - name: Install script (PowerShell)
        if: matrix.os == 'windows-latest'
        run: pwsh scripts/test-install.ps1
