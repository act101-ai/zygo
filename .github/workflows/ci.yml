name: ci
# Docs-only and README-only changes run no CI. Branch pushes run CI through their pull request only.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!LICENSE'
      - '!README.md'
      # Read by the tests (cargo test), so they still run CI:
      - 'docs/passthrough.md'
      - 'docs/premises.md'
      - 'docs/specs/2026-11-18-zygo-design.md'
      - 'docs/specs/2026-11-20-workspaces-design.md'
      - 'docs/conformance/**'
      - 'docs/conformance.md'
      - 'docs/conformance.json'
      - 'docs/live-checks.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!LICENSE'
      - '!README.md'
      # Read by the tests (cargo test), so they still run CI:
      - 'docs/passthrough.md'
      - 'docs/premises.md'
      - 'docs/specs/2026-11-18-zygo-design.md'
      - 'docs/specs/2026-11-20-workspaces-design.md'
      - 'docs/conformance/**'
      - 'docs/conformance.md'
      - 'docs/conformance.json'
      - 'docs/live-checks.md'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install libdbus (keyring Secret Service)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Install script (sh)
        if: matrix.os != 'windows-latest'
        run: sh scripts/test-install.sh
      - name: Install script (PowerShell)
        if: matrix.os == 'windows-latest'
        run: pwsh scripts/test-install.ps1
  # The premise test scripts (TF-2): POSIX sh, python3, cc; unix only, so no Windows. They use stubs
  # and 127.0.0.1 only; no real agent runs. No case passes or fails by wall-clock time; the job
  # timeout is a backstop only.
  premises:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Premise scrub tests
        run: python3 -I scripts/premises/scrub_test.py
      - name: Premise re-scrub tests
        run: python3 -I scripts/premises/rescrub_test.py
      - name: Premise check tests
        run: sh scripts/test-check-premises.sh
      - name: Premise harness tests
        run: sh scripts/premises/lib_test.sh
      # CI scans for the fixed name zzcinameq: it only exercises the scan path. The runner user
      # ("runner") is a whole word in a fixture (--runner-declares), so it cannot be used. The
      # privacy check is the operator's local run with the real user name in N2_FORBIDDEN_NAMES.
      - name: Premise check
        env:
          N2_FORBIDDEN_NAMES: zzcinameq
        run: sh scripts/check-premises.sh
