name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CC_x86_64_unknown_linux_musl: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install libdbus (keyring Secret Service)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test
        # Windows tests report but do not block the release until node N78 fixes them (owner decision 2026-11-20).
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: cargo test --workspace --locked --no-fail-fast
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - runner: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install rustup (Windows ARM)
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $u = 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe'
            Invoke-WebRequest -Uri $u -OutFile rustup-init.exe
            Invoke-WebRequest -Uri "$u.sha256" -OutFile rustup-init.exe.sha256
            # Guards against a corrupt download; the digest comes from the same host.
            $want = (Get-Content rustup-init.exe.sha256 -Raw).Trim().Split()[0]
            $got = (Get-FileHash -Algorithm SHA256 rustup-init.exe).Hash
            if ($got -ne $want) { Write-Error "rustup-init.exe checksum mismatch"; exit 1 }
            ./rustup-init.exe -y --profile minimal
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
          }
      - name: Install musl tools
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Release repository matches the binary
        shell: bash
        run: |
          grep -q "RELEASE_REPO: &str = \"${{ github.repository }}\"" crates/zygo/src/cmd/update.rs
      - name: Build
        shell: bash
        run: cargo build --release --locked -p zygo --target ${{ matrix.target }}
      - name: Static binary check
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/zygo" | grep -E 'statically linked|static-pie linked'
      - name: Test seam check
        shell: bash
        run: |
          if LC_ALL=C grep -aq ZYGO_RELEASE_BASE "target/${{ matrix.target }}/release/zygo${{ matrix.ext }}"; then
            echo "test seam in release binary"
            exit 1
          fi
      - name: Stage asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/zygo${{ matrix.ext }}" "zygo-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zygo-${{ matrix.target }}
          path: zygo-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zygo-*
          merge-multiple: true
      - name: Checksums and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- zygo-*
          count=$#
          if [ "$count" -ne 6 ]; then
            echo "expected 6 assets, found $count"
            exit 1
          fi
          sha256sum zygo-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '%s\n' "${GITHUB_REF_NAME#v}" > VERSION
          # A tag with a '-' before any '+' (v1.0.0-rc.1, not v1.0.0+build-7) is a prerelease, so latest/download never points to it.
          flags=()
          core=${GITHUB_REF_NAME%%+*}
          if [[ "$core" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" zygo-* SHA256SUMS VERSION --generate-notes "${flags[@]}" --repo "$GITHUB_REPOSITORY"
