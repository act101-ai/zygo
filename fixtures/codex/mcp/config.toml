model = "gpt-mock"
model_provider = "mock"

[model_providers.mock]
name = "mock"
base_url = "http://127.0.0.1:52350/v1"
env_key = "MOCK_API_KEY"
wire_api = "responses"

[projects."/repo"]
trust_level = "trusted"

[mcp_servers.zygo]
command = "python3"
args = ["-I", "/tmp/run/mcp/zygo_probe.py"]
default_tools_approval_mode = "approve"
