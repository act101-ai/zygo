model = "gpt-mock"
model_provider = "mock"

[model_providers.mock]
name = "mock"
base_url = "http://127.0.0.1:49334/v1"
env_key = "MOCK_API_KEY"
wire_api = "responses"

[features]
codex_hooks = true
hooks = true

[projects."/repo"]
trust_level = "trusted"

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "/tmp/run/hook.sh"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 1
