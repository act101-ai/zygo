[[capability]]
id = "A-1"
name = "Transport"
tier = "core"
standard = "Base URL → the proxy's dialect prefix; credential = the session token through the agent's key helper; the agent's own login and provider selection off (except passthrough)."

[[capability.criterion]]
id = "A-1.1"
text = "Each model request goes to the proxy at the client dialect's prefix."

[[capability.criterion]]
id = "A-1.2"
text = "The credential is the session token, got through the client's key helper; the token is in no argument, no environment row and no file except the session's `token` file (and the `0600` passthrough files of §12.3); passthrough excepted (§12.3)."

[[capability.criterion]]
id = "A-1.3"
text = "The client's own login and provider selection are off: no model request goes to a vendor host and no login prompt shows (passthrough excepted)."

[[capability.criterion]]
id = "A-1.4"
text = "The key-helper command runs in each shell that the client uses on Linux, macOS and Windows."

[[capability]]
id = "A-2"
name = "Attribution"
tier = "core"
standard = "`X-Zygo-Session`, `X-Zygo-Agent-Version`, `X-Zygo-Repo`, `X-Zygo-Work` (when set) on every request."

[[capability.criterion]]
id = "A-2.1"
text = "`X-Zygo-Session` on each request."

[[capability.criterion]]
id = "A-2.2"
text = "`X-Zygo-Agent-Version` on each request."

[[capability.criterion]]
id = "A-2.3"
text = "`X-Zygo-Repo` on each request when the session has a repository id."

[[capability.criterion]]
id = "A-2.4"
text = "`X-Zygo-Work` on each request when a work item is set."

[[capability]]
id = "A-3"
name = "Model list"
tier = "standard"
standard = "The picker shows the session's role list (§7.4); the default model and every alias the agent has are roles (§8.5)."

[[capability.criterion]]
id = "A-3.1"
text = "The picker shows the session's role list."

[[capability.criterion]]
id = "A-3.2"
text = "The default model is a role."

[[capability.criterion]]
id = "A-3.3"
text = "Each model alias of the client resolves to a role."

[[capability]]
id = "A-4"
name = "Subagent roles"
tier = "standard"
standard = "Every built-in agent/subagent the agent has maps to a role; an `zygo-<role>` subagent exists per enabled role with `model = <role>`."

[[capability.criterion]]
id = "A-4.1"
text = "Each built-in subagent maps to a role."

[[capability.criterion]]
id = "A-4.2"
text = "One `zygo-<role>` subagent exists per enabled role, with model `<role>`."

[[capability]]
id = "A-5"
name = "Per-session config"
tier = "core"
standard = "All `zygo` settings reach the agent through a per-session mechanism (a settings file passed by flag, an inline config env), never by editing the user's own files."

[[capability.criterion]]
id = "A-5.1"
text = "Each zygo setting reaches the client through a per-session mechanism."

[[capability.criterion]]
id = "A-5.2"
text = "zygo writes no file of the user's own client config."

[[capability.criterion]]
id = "A-5.3"
text = "Each setting that zygo writes is in effect: no user or project file overrides it."

[[capability]]
id = "A-6"
name = "Local services"
tier = "core"
standard = "`zygo mcp` registered as a stdio MCP server."

[[capability.criterion]]
id = "A-6.1"
text = "`zygo mcp` is registered as a stdio MCP server and starts in the session."

[[capability]]
id = "A-7"
name = "Result trimming"
tier = "standard"
standard = "Large tool results go through the result store (§10.1)."

[[capability.criterion]]
id = "A-7.1"
text = "Shell tool output over the threshold reaches the model as the §10.1 view."

[[capability.criterion]]
id = "A-7.2"
text = "File-read text output over the threshold, the same."

[[capability.criterion]]
id = "A-7.3"
text = "Search and listing tool output, the same."

[[capability.criterion]]
id = "A-7.4"
text = "Web-fetch output, the same (`n/a` for a client with no such tool)."

[[capability.criterion]]
id = "A-7.5"
text = "The view takes the place of the tool's output in the tool's own result, not of an error or a feedback message."

[[capability.criterion]]
id = "A-7.6"
text = "Bash tool output reaches the model through output shaping (§10.1, Shaping): color codes and progress removed, runs of equal lines counted, runner and kind views, below and above the threshold."

[[capability.criterion]]
id = "A-7.7"
text = "The output of a failed Bash call (exit code not 0) reaches the model through output shaping too (§10.1, Failed Bash call)."

[[capability]]
id = "A-8"
name = "Session context"
tier = "core"
standard = "The session text (§8.6) injected at session start."

[[capability.criterion]]
id = "A-8.1"
text = "The §8.6 session text reaches the main loop at each session start (new, cleared, resumed)."

[[capability.criterion]]
id = "A-8.2"
text = "The mechanics text (§8.6 item 7) reaches each `zygo-<role>` subagent."

[[capability]]
id = "A-9"
name = "Status"
tier = "extra"
standard = "Profile, work item, context use, compaction override and session savings on the agent's status surface, else `zygo status`."

[[capability.criterion]]
id = "A-9.1"
text = "The profile shows on the client's status surface, or in `zygo status` when the client has no surface."

[[capability.criterion]]
id = "A-9.2"
text = "The work item shows on the client's status surface, or in `zygo status` when the client has no surface."

[[capability.criterion]]
id = "A-9.3"
text = "The context use shows on the client's status surface, or in `zygo status` when the client has no surface."

[[capability.criterion]]
id = "A-9.4"
text = "The compaction override shows on the client's status surface, or in `zygo status` when the client has no surface."

[[capability.criterion]]
id = "A-9.5"
text = "The session savings show on the client's status surface, or in `zygo status` when the client has no surface."

[[capability.criterion]]
id = "A-9.6"
text = "Each status command that zygo writes runs in each shell the client uses."

[[capability.criterion]]
id = "A-9.7"
text = "The session run time (since the member's first start, or the session's own start outside a workspace) shows on the client's status surface, or in `zygo status` when the client has no surface."

[[capability]]
id = "A-10"
name = "Secrets hygiene"
tier = "core"
standard = "The env denylist (§8.4)."

[[capability.criterion]]
id = "A-10.1"
text = "The §8.4 denylist, with the client's rows, is applied to the client's environment."

[[capability.criterion]]
id = "A-10.2"
text = "The session token is not in the client's environment, passthrough excepted (§12.3)."

[[capability]]
id = "A-11"
name = "Skills and plugins"
tier = "standard"
standard = "The session's plugin snapshot delivered in the agent's own form (§15.3)."

[[capability.criterion]]
id = "A-11.1"
text = "The skills of the session's plugin snapshot load."

[[capability.criterion]]
id = "A-11.2"
text = "The other parts of each snapshot plugin (commands, agents, hooks, MCP servers) load in the client's form."

[[capability]]
id = "A-12"
name = "Model profile"
tier = "standard"
standard = "`--profile <name>` applied through the session (§11)."

[[capability.criterion]]
id = "A-12.1"
text = "`--profile <name>` applies through the session (§11)."

[[capability]]
id = "A-13"
name = "Version"
tier = "core"
standard = "A minimum agent version per agent in the built-in config; `zygo doctor` reports the installed version."

[[capability.criterion]]
id = "A-13.1"
text = "The descriptor holds a minimum version."

[[capability.criterion]]
id = "A-13.2"
text = "`zygo doctor` reports the installed version against it."

[[capability]]
id = "A-14"
name = "Role prompts"
tier = "standard"
standard = "The main role's prompt opens the session text; each `zygo-<role>` opens with its role's prompt."

[[capability.criterion]]
id = "A-14.1"
text = "The main role's prompt opens the session text."

[[capability.criterion]]
id = "A-14.2"
text = "Each `zygo-<role>` subagent's prompt opens with its role prompt."

[[capability]]
id = "A-15"
name = "Lead guard"
tier = "standard"
standard = "When the main loop runs on `main_role`, it cannot use the agent's file-edit tools (§8.3); subagents keep theirs."

[[capability.criterion]]
id = "A-15.1"
text = "When the main loop runs on `main_role`, its file-edit tools are refused."

[[capability.criterion]]
id = "A-15.2"
text = "Subagents keep their file-edit tools."

[[capability]]
id = "A-16"
name = "Compaction window"
tier = "standard"
standard = "The compaction signal (§10.2) or an equivalent agent setting; `zygo compact` works from the agent's shell."

[[capability.criterion]]
id = "A-16.1"
text = "The client compacts at the session's soft window (§10.2 signal or a client setting)."

[[capability.criterion]]
id = "A-16.2"
text = "A window change in a live session takes effect with no relaunch."

[[capability.criterion]]
id = "A-16.3"
text = "`zygo compact` works from the client's shell."

[[capability]]
id = "A-17"
name = "Model-triggered compaction"
tier = "extra"
standard = "The `compact` MCP tool (§10.3)."

[[capability.criterion]]
id = "A-17.1"
text = "The `compact` tool is listed to the model."

[[capability.criterion]]
id = "A-17.2"
text = "A call of it compacts the calling conversation (§10.2.3 trigger 2)."

[[capability]]
id = "A-18"
name = "Compaction instructions"
tier = "extra"
standard = "`zygo`'s keep/drop text reaches the agent's pre-compaction mechanism (§10.6)."

[[capability.criterion]]
id = "A-18.1"
text = "zygo's keep/drop text (§10.6) reaches the client's compaction."

[[capability.criterion]]
id = "A-18.2"
text = "The text names the session's open units at the time of the compaction."

[[capability]]
id = "A-19"
name = "Work units and guards"
tier = "standard"
standard = "§13 hooks."

[[capability.criterion]]
id = "A-19.1"
text = "`work_begin` is recorded with the calling agent's id (main loop or subagent)."

[[capability.criterion]]
id = "A-19.2"
text = "Each tool call appends its §13.3 lines."

[[capability.criterion]]
id = "A-19.3"
text = "A subagent stop runs the claims guard."

[[capability.criterion]]
id = "A-19.4"
text = "A guard can refuse a tool call."

[[capability]]
id = "A-20"
name = "Role tool restriction"
tier = "standard"
standard = "A `writes = false` role cannot use the edit tools, by definition, not by prompt; an optional turn cap."

[[capability.criterion]]
id = "A-20.1"
text = "A `writes = false` role cannot use the edit tools, by definition, not by prompt."

[[capability.criterion]]
id = "A-20.2"
text = "A role can have a turn cap."

[[capability]]
id = "A-21"
name = "Tests"
tier = "core"
standard = "A stub-agent launch test on Linux, macOS and Windows asserting the environment, flags and generated config; a premise test that reads the pinned agent's `--help` or schema for every setting key `zygo` writes."

[[capability.criterion]]
id = "A-21.1"
text = "A stub-agent launch test on Linux, macOS and Windows asserts the environment, the flags and the generated config."

[[capability.criterion]]
id = "A-21.2"
text = "A premise test finds each setting key, flag and environment row that zygo writes in the pinned `--help`, schema or capture."

[[capability]]
id = "WA-1"
name = "Resume"
tier = "standard"
standard = "Pre-assign or capture the agent session id; resume the conversation by that id (workspaces design AU28, W§8.2, W§8.3)."

[[capability.criterion]]
id = "WA-1.1"
text = "zygo has the client's session id (pre-assigned or captured) before the first turn ends."

[[capability.criterion]]
id = "WA-1.2"
text = "A resume by that id reopens the conversation in a new zygo session."

[[capability]]
id = "WA-2"
name = "Turn signals"
tier = "standard"
standard = "Turn start and end, subagent start and end, and the dispatch block, as hook or plugin events (workspaces design AU28, W§9.1)."

[[capability.criterion]]
id = "WA-2.1"
text = "Turn start."

[[capability.criterion]]
id = "WA-2.2"
text = "Turn end, also for a turn that the user interrupts."

[[capability.criterion]]
id = "WA-2.3"
text = "Subagent start, for each subagent."

[[capability.criterion]]
id = "WA-2.4"
text = "Subagent end, for each subagent."

[[capability.criterion]]
id = "WA-2.5"
text = "A dispatch block can refuse a subagent call."

[[capability]]
id = "WA-3"
name = "Mail wake and delivery"
tier = "standard"
standard = "Workspace mail reaches the member it is sent to: a busy member reads it before its turn ends, a new turn or start names the unread count, an idle member is woken, and the member's hooks fetch mail from other machines (workspace mail design M§7, mail sync design S§8.1, S§10)."

[[capability.criterion]]
id = "WA-3.1"
text = "A member busy in a turn reads mail delivered during the turn before the turn ends (M§7.1)."

[[capability.criterion]]
id = "WA-3.2"
text = "While the member has unread mail, the main loop gets the line `zygo: <n> new messages; read them with mail_read` at each new turn and at each session start (M§7.2)."

[[capability.criterion]]
id = "WA-3.3"
text = "An idle member whose launcher is live is woken with the fixed wake text, at most once in the wake gap (M§7.3)."

[[capability.criterion]]
id = "WA-3.4"
text = "The member's hook events (main-loop start, prompt, turn end, tool end) start the mail sync by the sync gap, and mail that the sync imports from another machine wakes its member as WA-3.3 does (S§8.1, S§10.1)."

[[bar_exception]]
client = "claude-code"
criterion = "A-1.4"
reason = "Windows without Git Bash runs the key helper in PowerShell, which needs & before a quoted path; zygo writes the double-quoted path, and CI runs the command only in Git Bash"
approved = "operator 2026-11-25, docs/specs/2026-11-25-client-model-design.md K-D18"

[[bar_exception]]
client = "opencode"
criterion = "A-1.4"
reason = "OpenCode has no key-helper command: it reads the session token through the {file:} reference in provider.zygo.options.apiKey (base spec 8.7, POC1), so no key-helper command runs in any shell; a core criterion cannot be n/a"
approved = "operator 2026-11-25, docs/specs/2026-11-25-client-model-design.md K-D18"
